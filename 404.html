    <title>Harini Chandrasekar</title>
    <!-- GitHub Pages serves this page for any address that does not exist, at that address, so nothing here may use a relative path:
         the styles are inline and the way home is worked out in the script below (the site lives under /harini-portolfio/ on github.io,
         at the root on its own domain). -->
    <style>
      html { background: #faf8f3; color: #151412; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 0 1.5rem;
        /* the site's own values, written out (this page cannot load the style sheets): --font-mono, --text-md, --weight-regular,

        font-family: "Suisse Int'l Mono", "Suisse Intl Mono", ui-monospace, "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;

    <main>
      <p>this page doesn't exist.</p>
      <a href="/" data-home>back to the start</a>
    </main>
    <script>
      (function () {
        var first = location.pathname.split("/")[1];
        var home = /\.github\.io$/i.test(location.hostname) && first ? "/" + first + "/" : "/";

        document.querySelector("[data-home]").setAttribute("href", home);
      })();
    </script>
